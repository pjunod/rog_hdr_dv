# Rebuild the Ubuntu desktop packages (Mutter, libdisplay-info) when Ubuntu
# publishes a new source version or the series revision changes, and publish
# them to this owner's Forgejo Debian registry. packaging/ubuntu/rebuild.sh
# does nothing when the registry already has the current versions.
name: Ubuntu packages

on:
  schedule:
    - cron: "23 7 * * *"
  push:
    branches: [main]
    paths:
      - "packaging/ubuntu/**"
      - "patches/ubuntu-mutter/**"
      - "patches/ubuntu-libdisplay-info/**"
  workflow_dispatch:

concurrency:
  group: ubuntu-packages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: [self-hosted, lab]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish what the registry lacks
        env:
          FORGEJO_URL: ${{ github.server_url }}
          FORGEJO_OWNER: ${{ github.repository_owner }}
          # A personal access token with write:package: the automatic Actions
          # token can only read an owner's packages.
          FORGEJO_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        # Private runner-owned storage, outside checkout and runner temp cleanup.
        # rebuild.sh reserves an exclusive run-* child only if a build is needed.
        # Do not upload raw source/build records to public mirrored CI artifacts.
        run: |
          # Resolve the host account home independently of job-level HOME overrides.
          retention_home=$(python3 -c 'import os, pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')
          packaging/ubuntu/rebuild.sh "$retention_home/.local/state/rog-hdr-dv/ubuntu-packages"
